<title>七上 2-1 查版本</title>
<style>
:root{--paper:#fcfbf8;--ink:#1c2130;--ink2:#4f5668;--line:#e4e1da;--blue:#3d6fb0;--red:#b23a2b;--green:#0f7a5a;--soft:#f4f2ee}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55;font-size:17px}
main{max-width:920px;margin:0 auto;padding:28px 16px 40px}
.kick{color:var(--ink2);font-size:14px;font-weight:700;margin:0}
h1{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:.15em 0 .1em}
.sub{margin:0 0 20px;color:var(--ink2)}
.vers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vers button{font:inherit;font-size:20px;font-weight:800;padding:16px 4px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;cursor:pointer}
.vers button[aria-pressed=true]{background:var(--blue);color:#fff}
.res{margin-top:14px;padding:18px;border-radius:14px;background:var(--soft);min-height:150px}
.hint{color:var(--ink2);margin:0;padding-top:42px;text-align:center}
.n{font-size:48px;font-weight:900;line-height:1.1;color:var(--green)}
.n.zero{color:var(--red)}
.where{font-weight:800;margin:.2em 0}
.res p{margin:.3em 0 0}
.go{font-weight:800;margin-top:12px!important;color:var(--blue)}
h2{font-size:23px;margin:36px 0 2px}
.lead{margin:0 0 12px;color:var(--ink2)}
.dif svg{display:block;width:100%;height:auto;background:#fff}
.dif svg.defs{position:absolute;width:0;height:0}
.narrow{display:none}
.src{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);margin-top:36px;padding-top:12px}
@media (max-width:640px){.dif svg.wide{display:none}.narrow{display:grid;gap:12px}}
</style>
</head>

<main>
<p class="kick">從一題會考題走進 AI 備課</p>
<h1>你的版本練過幾題？</h1>
<p class="sub">七上 2-1：先正推、再逆推（因數成對）</p>
<div class="vers" role="group" aria-label="選擇版本">
<button data-v="kx" aria-pressed="false">康軒</button><button data-v="ny" aria-pressed="false">南一</button><button data-v="hl" aria-pressed="false">翰林</button>
</div>
<div class="res" id="res" aria-live="polite"><p class="hint">點你學校用的版本</p></div>
